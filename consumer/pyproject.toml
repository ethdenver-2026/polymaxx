[project]
name = "signal-consumer"
version = "0.1.0"
description = "Signal consumer for prediction market trading"
requires-python = ">=3.12"
dependencies = [
    # Shared schema
    "signal-schema",

    # HTTP client
    "httpx[http2]>=0.28.0",

    # Validation
    "pydantic>=2.10.0",

    # Polymarket trading
    "py-clob-client>=0.34.5",

    # Logging
    "structlog>=25.0.0",

    # WebSocket server
    "websockets>=14.0",

    # Utilities
    "python-dotenv>=1.0.0",

    # REST API for dashboard
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
