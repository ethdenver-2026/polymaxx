[project]
name = "signal-consumer"
version = "0.1.0"
description = "Signal consumer for prediction market trading"
requires-python = ">=3.12"
dependencies = [
    # Shared schema
    "signal-schema",

    # HTTP client
    "httpx[http2]>=0.28.0",

    # Validation
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",

    # Webhook server
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.41.0",

    # Polymarket trading
    "py-clob-client>=0.34.5",

    # Logging
    "structlog>=25.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
signal-consumer = "signal_consumer.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
